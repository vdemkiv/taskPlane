name: Host compatibility watch
on:
  workflow_dispatch:
  schedule:
    # Monday 14:17 UTC = 09:17 EST / 10:17 EDT (Florida).
    - cron: '17 14 * * 1'
permissions:
  contents: read
  issues: write
concurrency:
  group: host-compatibility-watch
  cancel-in-progress: false
jobs:
  review:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Compare official sources and update the repository report
        run: python scripts/check_host_updates.py --publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Preserve report and deduplication snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: host-compatibility-report
          path: reports/host-watch/
          if-no-files-found: warn
          retention-days: 90
