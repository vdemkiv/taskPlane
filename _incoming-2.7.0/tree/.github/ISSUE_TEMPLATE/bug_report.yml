name: Bug report
description: A defect in taskplane (see SUPPORT.md for private/security reports)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        Security-sensitive reports must NOT be filed publicly — email the
        contact in SUPPORT.md instead. Remove source code, credentials,
        personal data, and other confidential information before attaching
        logs or screenshots.
  - type: input
    id: version
    attributes:
      label: taskplane version
      description: From the README "What's new" table or `.claude-plugin/plugin.json`.
      placeholder: "2.2.1"
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and host version
      placeholder: "Claude Code 1.x / Cowork / Codex CLI 0.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.5 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command or workflow being run
      placeholder: "taskplane build …, tp loop gate, tp-engineering review …"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest sequence of steps that shows the problem, plus expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (sanitized)
      description: Error text, `HEADLINE:` lines, or trace excerpts — with confidential content removed.
