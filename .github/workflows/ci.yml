name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
# Required jobs execute functional tests. Legacy performance nodes remain in the
# collection report with explicit exclusions; capacity.yml is disabled history.
# Operational timeout caps below are unchanged and are not acceptance targets.
jobs:
  portability:
    name: portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite portability --junitxml "${{ runner.temp }}/reports/portability.xml" --report-json "${{ runner.temp }}/reports/execution.json"
      - name: Archive diagnostic files with their original names
        if: always()
        shell: bash
        run: |
          python - <<'PY_ARCHIVE'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(root / "reports.tar.gz", "w:gz", dereference=False) as archive:
              archive.add(root / "reports", arcname="reports")
          PY_ARCHIVE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portability-${{ matrix.os }}
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
  suites:
    name: ${{ matrix.suite }} ${{ matrix.shard }}/${{ matrix.shards }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && matrix.suite == 'core' && 20 || 15 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        suite: [core]
        shard: [1, 2, 3, 4]
        shards: [4]
        include:
          - {os: windows-latest, suite: core, shard: 1, shards: 8}
          - {os: windows-latest, suite: core, shard: 2, shards: 8}
          - {os: windows-latest, suite: core, shard: 3, shards: 8}
          - {os: windows-latest, suite: core, shard: 4, shards: 8}
          - {os: windows-latest, suite: core, shard: 5, shards: 8}
          - {os: windows-latest, suite: core, shard: 6, shards: 8}
          - {os: windows-latest, suite: core, shard: 7, shards: 8}
          - {os: windows-latest, suite: core, shard: 8, shards: 8}
          - {os: ubuntu-latest, suite: native, shard: 1, shards: 6}
          - {os: ubuntu-latest, suite: native, shard: 2, shards: 6}
          - {os: ubuntu-latest, suite: native, shard: 3, shards: 6}
          - {os: ubuntu-latest, suite: native, shard: 4, shards: 6}
          - {os: ubuntu-latest, suite: native, shard: 5, shards: 6}
          - {os: ubuntu-latest, suite: native, shard: 6, shards: 6}
          - {os: windows-latest, suite: native, shard: 1, shards: 6}
          - {os: windows-latest, suite: native, shard: 2, shards: 6}
          - {os: windows-latest, suite: native, shard: 3, shards: 6}
          - {os: windows-latest, suite: native, shard: 4, shards: 6}
          - {os: windows-latest, suite: native, shard: 5, shards: 6}
          - {os: windows-latest, suite: native, shard: 6, shards: 6}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite ${{ matrix.suite }} --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shards }} --junitxml "${{ runner.temp }}/reports/${{ matrix.suite }}-${{ matrix.shard }}.xml" --report-json "${{ runner.temp }}/reports/execution.json"
      - name: Archive diagnostic files with their original names
        if: always()
        shell: bash
        run: |
          python - <<'PY_ARCHIVE'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(root / "reports.tar.gz", "w:gz", dereference=False) as archive:
              archive.add(root / "reports", arcname="reports")
          PY_ARCHIVE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ matrix.shard }}-${{ matrix.os }}
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
  archive-journeys:
    name: archive ${{ matrix.host }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host: [codex, claude, hostless]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite packages --host ${{ matrix.host }} --junitxml "${{ runner.temp }}/reports/archive.xml" --report-json "${{ runner.temp }}/reports/execution.json"
      - name: Archive diagnostic files with their original names
        if: always()
        shell: bash
        run: |
          python - <<'PY_ARCHIVE'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(root / "reports.tar.gz", "w:gz", dereference=False) as archive:
              archive.add(root / "reports", arcname="reports")
          PY_ARCHIVE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: archive-${{ matrix.host }}-${{ matrix.os }}
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
  quality-package:
    name: quality + package + release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - name: Install isolation canary dependencies
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/security_checks.py
      - run: python scripts/ci_local.py --check quality --report-json "${{ runner.temp }}/reports/quality.json"
      - run: python scripts/ci_local.py --check package --package-output "${{ runner.temp }}/packages" --report-json "${{ runner.temp }}/reports/package.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugins-${{ github.sha }}
          path: ${{ runner.temp }}/packages/
          if-no-files-found: error
      - name: Archive diagnostic files with their original names
        if: always()
        shell: bash
        run: |
          python - <<'PY_ARCHIVE'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(root / "reports.tar.gz", "w:gz", dereference=False) as archive:
              archive.add(root / "reports", arcname="reports")
          PY_ARCHIVE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: quality-package-profiles
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
  dashboard-browser:
    name: dashboard browser conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check browser --junitxml "${{ runner.temp }}/reports/browser.xml" --report-json "${{ runner.temp }}/reports/execution.json"
      - name: Archive diagnostic files with their original names
        if: always()
        shell: bash
        run: |
          python - <<'PY_ARCHIVE'
          import os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          with tarfile.open(root / "reports.tar.gz", "w:gz", dereference=False) as archive:
              archive.add(root / "reports", arcname="reports")
          PY_ARCHIVE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dashboard-browser
          path: ${{ runner.temp }}/reports.tar.gz
          if-no-files-found: error
  security:
    name: security scanners and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13"}
      - run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          python - <<'PY_VERIFY'
          import hashlib, os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive = root / "gitleaks.tar.gz"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb":
              raise SystemExit("Gitleaks checksum mismatch")
          with tarfile.open(archive) as bundle:
              bundle.extract(bundle.getmember("gitleaks"), path=root, filter="data")
          with open(os.environ["GITHUB_PATH"], "a") as paths:
              paths.write(str(root) + "\n")
          PY_VERIFY
      - run: python scripts/security_checks.py --scanners
  interpreter-import:
    name: interpreter import (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m compileall -q taskplane scripts
      - run: python taskplane/tp.py --help
      - run: python taskplane/tp.py flow --help
  tests:
    name: tests (python 3.12)
    if: always()
    needs: [portability, suites, archive-journeys, quality-package, dashboard-browser, security, interpreter-import]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
  native-portability:
    name: native portability (windows)
    if: always()
    needs: [portability, suites, archive-journeys, quality-package, dashboard-browser, security, interpreter-import]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
