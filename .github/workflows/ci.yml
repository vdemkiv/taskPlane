name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: "1"
jobs:
  portability:
    name: portability preflight (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite portability --junitxml reports/portability.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: portability-${{ matrix.os }}
          path: reports/portability.xml
          if-no-files-found: error
  suites:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    needs: portability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        suite: [core, native]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite ${{ matrix.suite }} --junitxml reports/${{ matrix.suite }}.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: ${{ matrix.suite }}-${{ matrix.os }}
          path: reports/*.xml
          if-no-files-found: error
  archive-journeys:
    name: archive ${{ matrix.host }} (${{ matrix.os }})
    needs: portability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        host: [codex, claude]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite packages --host ${{ matrix.host }} --junitxml reports/archive.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: archive-${{ matrix.host }}-${{ matrix.os }}
          path: reports/archive.xml
          if-no-files-found: error
  capacity:
    name: full capacity ${{ matrix.host }} (${{ matrix.os }})
    needs: portability
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, host: codex}
          - {os: windows-latest, host: claude}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite capacity --host ${{ matrix.host }} --junitxml reports/capacity.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capacity-${{ matrix.host }}-${{ matrix.os }}
          path: reports/capacity.xml
          if-no-files-found: error
  quality-package:
    name: quality + package + release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python scripts/security_checks.py
      - run: python scripts/ci_local.py --check quality
      - run: python scripts/ci_local.py --check package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugins-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  dashboard-browser:
    name: dashboard browser conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check browser --junitxml reports/browser.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dashboard-browser
          path: reports/browser.xml
          if-no-files-found: error
  security:
    name: security scanners and dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false, fetch-depth: 0}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.13", cache: pip, cache-dependency-path: requirements-ci.txt}
      - run: python -m pip install --require-hashes --no-deps -r requirements-ci.txt
      - name: Install verified Gitleaks release
        shell: bash
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          python - <<'PY_VERIFY'
          import hashlib, os, pathlib, tarfile
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          archive = root / "gitleaks.tar.gz"
          if hashlib.sha256(archive.read_bytes()).hexdigest() != "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb":
              raise SystemExit("Gitleaks checksum mismatch")
          with tarfile.open(archive) as bundle:
              bundle.extract(bundle.getmember("gitleaks"), path=root, filter="data")
          with open(os.environ["GITHUB_PATH"], "a") as paths:
              paths.write(str(root) + "\n")
          PY_VERIFY
      - run: python scripts/security_checks.py --scanners
  interpreter-import:
    name: interpreter import (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m compileall -q taskplane scripts
      - run: python taskplane/tp.py --help
      - run: python taskplane/tp.py flow --help
  tests:
    name: tests (python 3.12)
    if: always()
    needs: [portability, suites, archive-journeys, capacity, quality-package, dashboard-browser, security, interpreter-import]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
  native-portability:
    name: native portability (windows)
    if: always()
    needs: [portability, suites, archive-journeys, capacity, quality-package, dashboard-browser, security, interpreter-import]
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI suite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json, os; results = json.loads(os.environ["RESULTS"]); assert all(job["result"] == "success" for job in results.values()), results'
