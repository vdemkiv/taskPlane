name: Storage capacity stress
on:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * 1'
permissions:
  contents: read
concurrency:
  group: capacity-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: "1"
jobs:
  capacity:
    name: full capacity ${{ matrix.host }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, host: codex}
          - {os: ubuntu-latest, host: claude}
          - {os: windows-latest, host: codex}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {persist-credentials: false}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests --suite capacity --host ${{ matrix.host }} --junitxml reports/capacity.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: capacity-${{ matrix.host }}-${{ matrix.os }}
          path: reports/capacity.xml
          if-no-files-found: error
