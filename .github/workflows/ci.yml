name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pull-request-{0}', github.event.pull_request.number) || format('protected-main-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Historical key retained for branch-protection compatibility. This is now
  # the read-only, settings-derived plan rather than an independent test job.
  wave3-contracts:
    name: freeze exact candidate and authoritative CI plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max-parallel: ${{ steps.plan.outputs.max-parallel }}
      artifact-days: ${{ steps.plan.outputs.artifact-days }}
      candidate-sha: ${{ steps.plan.outputs.candidate-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Emit one settings-derived read-only plan
        id: plan
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EXACT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci_local.py \
            --emit-ci-plan "$RUNNER_TEMP/ci-runtime.json" \
            --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" \
            --ref "$EXACT_REF" --run-id "$RUN_ID"
          python3 - "$RUNNER_TEMP/ci-runtime.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          runtime = json.load(open(sys.argv[1], encoding="utf-8"))
          plan = runtime["plan"]
          matrix = {"include": [
              {"id": row["id"], "kind": row["kind"]}
              for row in plan["cells"]
          ]}
          with open(sys.argv[2], "a", encoding="utf-8") as output:
              output.write("matrix=" + json.dumps(matrix, separators=(",", ":")) + "\n")
              output.write(f"max-parallel={plan['max_parallel']}\n")
              output.write("artifact-days=" + str(
                  runtime["settings_receipt"]["effective"]["cleanup"]["artifacts_days"]
              ) + "\n")
              output.write(f"candidate-sha={runtime['candidate']['source_sha']}\n")
          PY
      - name: Preserve frozen plan and settings receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-runtime-${{ steps.plan.outputs.candidate-sha }}
          path: ${{ runner.temp }}/ci-runtime.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.plan.outputs.artifact-days) }}

  authoritative:
    name: authoritative (${{ matrix.id }})
    needs: [wave3-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.kind == 'browser' && 7 || 5 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.wave3-contracts.outputs.max-parallel) }}
      matrix: ${{ fromJSON(needs.wave3-contracts.outputs.matrix) }}
    env:
      CODEX_HOME: ""
      CODEX_THREAD_ID: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.wave3-contracts.outputs.candidate-sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore the immutable candidate plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-runtime-${{ needs.wave3-contracts.outputs.candidate-sha }}
          path: ${{ runner.temp }}/runtime
      - name: Install hash-locked sealed validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/requirements-test.lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps \
            -r "$RUNNER_TEMP/requirements-test.lock"
      - name: Install hash-locked quality tools only in their owning cell
        if: matrix.kind == 'quality-package'
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes -r requirements-dev.lock
      - name: Configure exact-checkout git identity
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"
      - name: Execute only this disjoint candidate-bound cell
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/cell-evidence"
          python3 scripts/ci_local.py \
            --runtime-plan "$RUNNER_TEMP/runtime/ci-runtime.json" \
            --ci-cell "${{ matrix.id }}" \
            --receipt "$RUNNER_TEMP/cell-evidence/${{ matrix.id }}.json"
          code=$?
          echo "$code" > "$RUNNER_TEMP/cell-evidence/exit-code"
          exit 0
      - name: Preserve candidate, environment, timing, failure class, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-cell-${{ matrix.id }}-${{ needs.wave3-contracts.outputs.candidate-sha }}
          path: ${{ runner.temp }}/cell-evidence
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.wave3-contracts.outputs.artifact-days) }}
      - name: Enforce cell result after durable receipt upload
        if: always()
        shell: bash
        run: test "$(cat "$RUNNER_TEMP/cell-evidence/exit-code")" = "0"

  # Branch-protection key retained. This is both the pushed SHA delivery proof
  # and the exact PR head SHA blocking proof; synthetic_merge_substitutes=false.
  pushed-sha-proof:
    name: terminal authoritative receipt aggregate
    if: always()
    needs: [wave3-contracts, authoritative]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pull-request head
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact protected-main push
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Restore frozen plan
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ci-runtime-${{ needs.wave3-contracts.outputs.candidate-sha }}
          path: ${{ runner.temp }}/runtime
      - name: Restore every disjoint cell receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ci-cell-*-${{ needs.wave3-contracts.outputs.candidate-sha }}
          path: ${{ runner.temp }}/receipts
      - name: Seal matching all-green terminal matrix
        run: >-
          python3 scripts/ci_local.py
          --runtime-plan "$RUNNER_TEMP/runtime/ci-runtime.json"
          --receipt-root "$RUNNER_TEMP/receipts"
          --aggregate-ci "$RUNNER_TEMP/terminal-matrix.json"
      - name: Preserve terminal matrix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-matrix-${{ needs.wave3-contracts.outputs.candidate-sha }}
          path: ${{ runner.temp }}/terminal-matrix.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.wave3-contracts.outputs.artifact-days) }}
