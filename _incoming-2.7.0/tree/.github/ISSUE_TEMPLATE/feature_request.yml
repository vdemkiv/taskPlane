name: Feature request
description: Propose an improvement to taskplane
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem or gap
      description: What are you trying to do that taskplane doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host(s) this applies to
      placeholder: "Claude Code / Cowork / Codex / Claude Tag / all"
  - type: textarea
    id: guardrails
    attributes:
      label: Guardrail impact
      description: >
        taskplane's rule is that convenience never weakens enforcement.
        Note if the request touches gates, contracts, scopes, or evidence.
