<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TaskPlane — from request to reviewed software</title>
<style>
:root{color-scheme:dark;--bg:#141510;--card:#242620;--line:#45483e;--ink:#f3f3ec;--muted:#b9bdb0;--mint:#a8dbc0;--gold:#eed697}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit}#stage{width:1400px;height:1000px;padding:48px 64px;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;font-size:19px;letter-spacing:2px}.brand{font-weight:bold}.tag{font-size:16px;letter-spacing:1px;color:var(--muted);border:1px solid var(--line);padding:10px 14px;border-radius:30px}.eyebrow{color:var(--mint);font-size:19px;letter-spacing:2px;margin:34px 0 14px}h1{font-size:46px;letter-spacing:-1.3px;line-height:1.13;margin:0 0 14px;font-weight:600}p{margin:0;color:var(--muted);font-size:23px;line-height:1.45}.phases{display:grid;grid-template-columns:repeat(7,1fr);gap:9px;margin:29px 0 30px}.phase{padding:15px 12px;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:8px;background:var(--card);font-size:19px}.phase small{display:block;font-size:15px;color:var(--muted);margin-top:9px}.phase.done{border-top-color:var(--mint)}.phase.active{border:1px solid var(--mint);border-top:3px solid var(--mint);box-shadow:0 0 0 1px var(--mint)}.phase.active small{color:var(--mint)}.body{height:402px;display:flex;flex-direction:column;gap:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.three{grid-template-columns:repeat(3,1fr)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:23px 25px}.card h2{font-size:25px;margin:0 0 14px;font-weight:500}.card p{font-size:21px}.label{font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:1.3px;margin-bottom:13px}.big{font-size:34px;color:var(--ink);line-height:1.3}.mint{color:var(--mint)}.gold{color:var(--gold)}.note{border-left:3px solid var(--mint);background:var(--card);padding:16px 21px;font-size:21px;line-height:1.4}.row{display:grid;grid-template-columns:140px 1fr 180px;gap:15px;align-items:center;border-top:1px solid var(--line);padding:19px 20px;font-size:21px}.row:first-child{border-top:0}.table{border:1px solid var(--line);border-radius:12px;overflow:hidden}.thead{background:var(--card);font-size:16px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:8px 12px;font-size:17px}.pill.ok{border-color:#678f78;color:var(--mint)}.pill.wait{border-color:#91805c;color:var(--gold)}.prompt{font-size:32px;line-height:1.4;padding:26px 30px;border:1px solid var(--mint);border-radius:12px;background:var(--card)}.prompt span{color:var(--mint);margin-right:13px}.detail{display:flex;justify-content:space-between;font-size:21px;padding:9px 0}.actions{display:flex;gap:12px;margin-top:19px}.btn{border:1px solid var(--mint);padding:12px 17px;border-radius:7px;color:var(--mint);font-size:20px}.btn.secondary{color:var(--ink);border-color:var(--line)}.graph{display:flex;align-items:center;gap:20px}.node{flex:1;border:1px solid var(--line);padding:22px;border-radius:12px;background:var(--card);text-align:center;font-size:24px}.node small{display:block;color:var(--muted);font-size:18px;margin-top:10px}.arrow{font-size:30px;color:var(--mint)}.parallel{display:grid;grid-template-columns:1fr 80px 1fr;align-items:center;gap:12px}.stack{display:grid;gap:14px}.meter{height:8px;border-radius:5px;background:#41463a;margin-top:20px;overflow:hidden}.meter i{height:100%;background:var(--mint);display:block}.foot{position:absolute;bottom:50px;left:64px;right:64px;border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;font-size:17px;color:var(--muted)}.progress{height:3px;background:var(--mint);position:absolute;bottom:0;left:0}.controls{display:flex;gap:12px;align-items:center;padding:18px 24px;flex-wrap:wrap}.controls button{color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;cursor:pointer}.controls button:focus-visible{outline:3px solid var(--mint);outline-offset:3px}#counter{color:var(--muted)}#viewport{overflow:hidden;width:100%}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style>
<div id="viewport"><main id="stage" aria-label="TaskPlane capability walkthrough"></main></div>
<nav class="controls" aria-label="Walkthrough controls"><button id="previous">← Previous</button><button id="play">Play</button><button id="next">Next →</button><span id="counter" aria-live="polite"></span></nav>
<script>
const phases=['Product','Design','Plan','Build','Evaluate','Engineering','Retro'];
const card=(label,title,copy)=>`<div class="card"><div class="label">${label}</div><h2>${title}</h2><p>${copy}</p></div>`;
const row=(id,text,status,kind='ok')=>`<div class="row"><span>${id}</span><span>${text}</span><span class="pill ${kind}">${status}</span></div>`;
const table=(rows)=>`<div class="table"><div class="row thead"><span>Criterion</span><span>Expected outcome</span><span>Evidence</span></div>${rows}</div>`;
const scenes=[
{phase:-1,kicker:'ONE GOAL · ONE CONNECTED RUN',title:'From a request to reviewed software.',subtitle:'TaskPlane coordinates delivery inside Claude Code and Codex.',body:`<div class="prompt"><span>›</span>taskplane build CSV export for monthly reports.</div><div class="grid three">${card('Define','A clear outcome','Scope, acceptance criteria and design decisions.')}${card('Deliver','Coordinated work','Dependencies, focused workers and shared progress.')}${card('Verify','Evidence you can inspect','Test results, review findings and explicit decisions.')}</div><div class="note">Follow the same goal from Product to Retro. Start with review or design alone when that is all you need.</div>`},
{phase:0,kicker:'01 / PRODUCT',title:'Agree on what success looks like.',subtitle:'Turn a request into a bounded outcome before implementation begins.',body:table(row('AC-01','Export the selected month and visible report columns.','Defined','wait')+row('AC-02','Keep existing access permissions.','Defined','wait')+row('AC-03','Handle empty reports and escaped CSV values.','Defined','wait'))+`<div class="note">Checkpoint: review the scope and acceptance criteria, then accept or request changes.</div>`},
{phase:1,kicker:'02 / DESIGN',title:'See what the change touches.',subtitle:'Use source dependencies and component boundaries to shape the design.',body:`<div class="graph"><div class="node">Report page<small>Export action + feedback</small></div><span class="arrow">→</span><div class="node">Export service<small>CSV format + streaming</small></div><span class="arrow">→</span><div class="node">Permissions<small>Existing access check</small></div></div><div class="grid">${card('Decision','Reuse the permission boundary','Keep export access aligned with the report users can already view.')}${card('Validation plan','Make edge cases observable','Check quoting, Unicode, empty data and unauthorized requests.')}</div><div class="note">Artifacts stay connected: requirements → design choices → planned checks.</div>`},
{phase:2,kicker:'03 / PLAN',title:'Give every worker a clear job.',subtitle:'Define ownership, allowed paths, dependencies and required verification.',body:`<div class="parallel"><div class="stack">${card('Task A · native worker','CSV export','Implement the agreed export interface.')}${card('Task B · native worker','Report action','Add the export control and user feedback.')}</div><div class="arrow" style="text-align:center">→</div><div class="card"><div class="label">Depends on A + B</div><h2>Integrate and verify</h2><p>Join the results, check the combined change and retain the evidence.</p><div class="pill wait" style="margin-top:24px">Waits for prerequisites</div></div></div><div class="note">Ready, independent tasks can run concurrently within the host’s available capacity.</div>`},
{phase:3,kicker:'04 / BUILD',title:'Independent work moves in parallel.',subtitle:'Workers receive focused context while the shared run retains the accepted plan.',body:`<div class="grid"><div class="card"><div class="label">Native worker A</div><h2>CSV export</h2><p>Implementing escaping and empty-report handling.</p><div class="meter"><i style="width:72%"></i></div><div class="detail"><span>Work</span><span class="mint">In progress</span></div></div><div class="card"><div class="label">Native worker B</div><h2>Report action</h2><p>Connecting the export action and permission feedback.</p><div class="meter"><i style="width:54%"></i></div><div class="detail"><span>Work</span><span class="mint">In progress</span></div></div></div><div class="grid three">${card('Shared status','2 live workers','Example workers on disjoint task paths.')}${card('Integration','Waiting','Dependent work starts after accepted results.')}${card('Usage','Unknown','Missing run measurements stay explicit.')}</div>`},
{phase:3,kicker:'CHECKPOINT / YOUR DECISION',title:'Inspect the evidence. Choose the next step.',subtitle:'Work status, evidence validation and approval remain separate.',body:`<div class="grid"><div class="card"><div class="label">Checkpoint pane · example</div><div class="detail"><span>Work</span><span>Produced</span></div><div class="detail"><span>Evidence</span><span class="mint">Validated</span></div><div class="detail"><span>Decision</span><span class="gold">Awaiting acceptance</span></div><div class="actions"><span class="btn">Accept</span><span class="btn secondary">Request changes</span></div><p style="font-size:18px;margin-top:17px">Claude Mod controls where supported; conversation and dashboard elsewhere.</p></div><div class="card"><div class="label">Revision comment</div><h2>“Include an empty-report case.”</h2><p>The requested change stays with the checkpoint. Revised output is reviewed again.</p><div class="pill wait" style="margin-top:24px">Request changes → revise → resubmit</div></div></div><div class="note">Human decisions are the default. Explicit automatic approval still depends on your conditions and required checks.</div>`},
{phase:4,kicker:'05 / EVALUATE',title:'Check the result against the requirements.',subtitle:'Show what passed, what failed and what remains unknown for each criterion.',body:table(row('AC-01','Selected month and columns match the report.','Example: pass')+row('AC-02','Unauthorized export is refused.','Example: pass')+row('AC-03','Empty data, quotes and Unicode are covered.','Example: pass'))+`<div class="note">Illustrative results only. A real run links each verdict to its captured verification evidence.</div>`},
{phase:5,kicker:'06 / ENGINEERING',title:'Review the code through independent lenses.',subtitle:'Trace an actionable finding to its source, supporting evidence and verification.',body:`<div style="display:flex;gap:12px"><span class="pill">Architecture</span><span class="pill">Security</span><span class="pill">Testability</span><span class="pill">DevOps</span></div><div class="grid"><div class="card"><div class="label">Finding 1 of 1 · example</div><h2>F-01 · Spreadsheet formula handling</h2><p>Cells beginning with formula characters need an explicit export policy.</p><div class="pill wait" style="margin-top:20px">Disposition: open</div></div><div class="card"><div class="label">Evidence browser</div><div class="detail"><span>Source</span><span>export/csv.ts:42</span></div><div class="detail"><span>Review lens</span><span>Security</span></div><div class="detail"><span>Verification</span><span>Source reviewed</span></div><p style="font-size:18px;margin-top:16px">Example path and finding. A review does not silently authorize a fix.</p></div></div><div class="note">Accepting a review acknowledges its evidence. Findings need an explicit resolution or deferral.</div>`},
{phase:6,kicker:'07 / RETRO',title:'Close the run with a clear handoff.',subtitle:'Record what shipped, what was learned and what still needs an owner.',body:`<div class="grid three">${card('Delivered','CSV export','Monthly selection, access checks and edge-case handling.')}${card('Evidence','Linked and retained','Accepted artifacts, verification results and review history.')}${card('Follow-up','F-01 · deferred','Export owner to define spreadsheet formula handling.')}</div><div class="card"><div class="label">Example delivery summary</div><div class="detail"><span>Acceptance criteria</span><span class="mint">3 example passes</span></div><div class="detail"><span>Known follow-up</span><span class="gold">1 · named owner</span></div><div class="detail"><span>Final checkpoint</span><span>Ready for your decision</span></div></div>`},
{phase:7,kicker:'TASKPLANE / FULL DELIVERY',title:'A visible path from intent to evidence.',subtitle:'One run connects the goal, the work, the decisions and the result.',body:`<div class="grid three">${card('Outcome','Requirements stay visible','Product and design decisions inform the implementation.')}${card('Execution','Work stays coordinated','Workers follow the task graph and return scoped evidence.')}${card('Confidence','Results stay inspectable','Checks and review findings remain linked after delivery.')}</div><div class="prompt" style="margin-top:6px"><span>›</span>taskplane build your next small feature.</div><div class="note">Also start with a focused design, a read-only review, or a status check.</div>`}
];
let current=0,timer=null;
function renderScene(index){current=(index+scenes.length)%scenes.length;const s=scenes[current];document.getElementById('stage').innerHTML=`<div class="top"><span class="brand">TASKPLANE / DELIVERY OVERVIEW</span><span class="tag">ILLUSTRATED EXAMPLE · NOT A LIVE RUN</span></div><div class="eyebrow">${s.kicker}</div><h1>${s.title}</h1><p>${s.subtitle}</p><div class="phases">${phases.map((p,i)=>`<div class="phase ${i<s.phase?'done':''} ${i===s.phase?'active':''}">${p}<small>${s.phase<0?'Delivery stage':i<s.phase?'Accepted':i===s.phase?'Current stage':'Up next'}</small></div>`).join('')}</div><section class="body">${s.body}</section><div class="foot"><span>Goal: CSV export for monthly reports</span><span>${String(current+1).padStart(2,'0')} / ${scenes.length} · Scope → work → evidence → decision</span></div><div class="progress" style="width:${100*(current+1)/scenes.length}%"></div>`;document.getElementById('counter').textContent=`${current+1} of ${scenes.length}: ${s.title}`}
function pause(){clearInterval(timer);timer=null;document.getElementById('play').textContent='Play'}
document.getElementById('play').onclick=()=>{if(timer)pause();else{timer=setInterval(()=>renderScene(current+1),5000);document.getElementById('play').textContent='Pause'}};
document.getElementById('previous').onclick=()=>{pause();renderScene(current-1)};document.getElementById('next').onclick=()=>{pause();renderScene(current+1)};
window.renderScene=renderScene;window.sceneCount=scenes.length;
function resize(){const scale=Math.min(1,innerWidth/1400);document.getElementById('stage').style.transform=`scale(${scale})`;document.getElementById('stage').style.transformOrigin='top left';document.getElementById('viewport').style.height=1000*scale+'px'}
addEventListener('resize',resize);renderScene(0);resize();
</script>
</html>
