name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: CI only reads the checkout. Without this block the jobs
# would inherit the repository default GITHUB_TOKEN scope (often read-write).
permissions:
  contents: read

jobs:
  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    # This matrix is the host-neutral contract. Keep Codex markers explicitly
    # empty so a runner image or caller environment cannot silently switch the
    # workflow detector/model defaults under the portable suite.
    env:
      CODEX_HOME: ""
      CODEX_THREAD_ID: ""
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            tests: >-
              taskplane/tests/test_r0002_reviewkernel_regression_floor.py
              taskplane/tests/test_repository_preflight.py
              taskplane/tests/test_storage_kernel.py
              taskplane/tests/test_windows_portability.py
          - python: "3.11"
            tests: >-
              taskplane/tests/test_r0002_reviewkernel_regression_floor.py
              taskplane/tests/test_repository_preflight.py
              taskplane/tests/test_storage_kernel.py
              taskplane/tests/test_windows_portability.py
          - python: "3.12"
            tests: >-
              taskplane/tests
              --ignore=taskplane/tests/test_codex_compat.py
              --ignore=taskplane/tests/test_dispatch_parity.py
              --ignore=taskplane/tests/test_lens_signals_fixtures.py
              --ignore=taskplane/tests/test_stage_waves.py
    steps:
      # Third-party actions are pinned to full commit SHAs (tag as comment) so
      # a moved/compromised tag cannot change what runs in the release-trust path.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install test runner (pinned major; the plugin itself is stdlib-only)
        run: pip install "pytest==8.*"

      - name: Configure git (the gates and tests need commit identity)
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"

      # Run from the repo ROOT (not `working-directory: taskplane`): conftest.py
      # imports the `taskplane` package for shared store isolation, which only
      # resolves when the repo root is on sys.path. Running inside taskplane/
      # aborted collection with ModuleNotFoundError (v2.3.1 fix).
      - name: Run the authoritative suite or compatibility smoke set
        run: python -m pytest ${{ matrix.tests }} -q

      # One public unittest canary retains second-runner/store-isolation
      # coverage without executing the entire pytest-owned suite twice.
      - name: Unittest runner/store-isolation canary
        if: matrix.python == '3.12'
        run: >-
          python -m unittest
          taskplane.tests.test_runner_isolation.TestUnittestRunnerIsolation
          -v

      # ENCODING PORTABILITY, made gateable on the fast runner.
      #
      # Every `open()` without an explicit encoding, and every print of an
      # arrow or em dash, uses the HOST's default text encoding. On Linux
      # that is UTF-8 and the defect is invisible; on Windows it is cp1252
      # and taskplane crashed on its own output — `tp kb migrate` and
      # `tp northstar` died mid-print, requirement files could not be
      # written at all. Those failures only ever appeared on the advisory
      # windows-latest leg, which is slow, times out, and cannot block.
      #
      # A C locale gives Python an ASCII default — strictly NARROWER than
      # cp1252 — so this leg reproduces the whole class in about two
      # minutes on ubuntu, and blocks. Two cases skip themselves here
      # because they carry non-ASCII through argv and filesystem paths,
      # which a C-locale host cannot represent at all; that is a harness
      # limit rather than a product one (Windows paths are UTF-16).
      - name: Encoding-sensitive boundaries under a non-UTF-8 locale
        if: matrix.python == '3.12'
        env:
          LC_ALL: C
          LANG: C
          PYTHONUTF8: "0"
          PYTHONCOERCECLOCALE: "0"
        run: >-
          python -m pytest -q
          taskplane/tests/test_subprocess_encoding.py
          taskplane/tests/test_windows_portability.py

      # Per-task cost ratchet (P3, R-0012). Between mid-July and v3 phase 3
      # the loop's per-task cost grew about thirteenfold with no single
      # change to blame: four defensible local decisions multiplied, and
      # governance was the only part of this system without a budget. This
      # leg drives a complete miniature loop and pins what the engine
      # MANDATES per task. Raising a pin is allowed and expected — it just
      # has to be a decision someone records, not drift nobody sees.
      - name: Per-task cost ratchet (governance has a budget too)
        if: matrix.python == '3.12'
        run: python3 scripts/ci_loop_cost.py

  # Host portability without a second full-suite tax. Windows runs the
  # cross-host contract plus the two integration files that previously found
  # real Windows-only failures. Those defects are also reproduced on Linux by
  # test_windows_portability.py, so the hosted leg validates the actual host
  # boundary rather than spending ~27 minutes duplicating the full suite.
  # macOS remains an advisory host-boundary signal.
  tests-portability:
    name: tests portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.advisory }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            advisory: false
            tests: >-
              taskplane/tests/test_windows_portability.py
              taskplane/tests/test_loop_context_traces.py
              taskplane/tests/test_eval_recorder.py
          - os: macos-latest
            advisory: true
            tests: >-
              taskplane/tests/test_repository_preflight.py
              taskplane/tests/test_storage_kernel.py
              taskplane/tests/test_loop_context_traces.py
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test runner (pinned major; the plugin itself is stdlib-only)
        run: pip install "pytest==8.*"
      - name: Configure git (the gates and tests need commit identity)
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"
      - name: Run the suite
        run: python -m pytest ${{ matrix.tests }} -q

  validate-plugin:
    name: plugin manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JSON manifests parse and versions agree
        run: |
          python - <<'PY'
          import json, re, sys, glob
          pj = json.load(open(".claude-plugin/plugin.json"))
          cj = json.load(open(".codex-plugin/plugin.json"))
          mp = json.load(open(".claude-plugin/marketplace.json"))
          hooks = json.load(open("hooks/hooks.json"))
          versions = {pj["version"], cj["version"],
                      mp["plugins"][0]["version"], mp["version"]}
          assert len(versions) == 1, f"version drift: {sorted(versions)}"
          assert cj["name"] == pj["name"] == mp["plugins"][0]["name"]
          assert cj["skills"] == "./skills/"
          assert "PreToolUse" in hooks["hooks"]
          for f in glob.glob("skills/*/SKILL.md"):
              desc = re.search(r'description:\s*"(.*)"', open(f).read())
              if desc and ("<" in desc.group(1) or ">" in desc.group(1)):
                  sys.exit(f"{f}: XML tags in description break plugin validation")
          print("manifests ok:", pj["name"], pj["version"])
          PY

      # Makes the CHANGELOG's 'single-source versioning, CI-gated' claim
      # literally true (v2.3.1): the single source is .codex-plugin/plugin.json
      # and every other surface is verified against it here, independently of
      # the pytest jobs.
      - name: Version is single-sourced (tp version --verify)
        run: python3 taskplane/tp.py version --verify

      - name: Generated lens artifacts match their sources (no drift)
        run: |
          python3 lenses/_generate_catalog.py
          python3 lenses/_generate_lens_prompts.py
          python3 scripts/gen_lens_catalog.py
          git diff --exit-code -- lenses/ docs/lens-catalog.md

      # t8 (R-0010 / D5): the CLI reference is GENERATED from tp.py's live
      # argparse tree, on the same generated-artifacts pattern as the lens
      # drift check above. This leg is what makes the flag documentation
      # structural instead of remembered: add a flag without help text and
      # the generator REFUSES (nonzero, reason on stderr); add a flag and
      # forget to regenerate, and git diff --exit-code fails here. It is
      # also why taskplane/tests/test_release_freshness.py could burn its
      # 34-flag _LEGACY_UNDOCUMENTED exemption list down to empty — the
      # freshness corpus globs docs/*.md, so the reference documents every
      # flag mechanically. Remedy on failure is one command: run the regen
      # line below and commit docs/cli-reference.md.
      - name: Generated CLI reference matches tp.py's argparse tree (no drift)
        run: |
          python3 taskplane/tp.py help --md > docs/cli-reference.md
          git diff --exit-code -- docs/cli-reference.md

      - name: Build and validate OpenAI marketplace package
        run: python scripts/package_openai.py

      # dist/ is gitignored (submission artifacts never live in the repo), so
      # there is no committed zip to compare against; what release provenance
      # relies on instead is DETERMINISM — the published .sha256 must be
      # reproducible from the tree. Build twice and require identical bytes.
      - name: OpenAI package build is deterministic (release provenance)
        run: |
          python3 scripts/package_openai.py --output-dir /tmp/tp-pkg-a
          python3 scripts/package_openai.py --output-dir /tmp/tp-pkg-b
          a=$(sha256sum /tmp/tp-pkg-a/*.zip | cut -d' ' -f1)
          b=$(sha256sum /tmp/tp-pkg-b/*.zip | cut -d' ' -f1)
          echo "build A: $a"; echo "build B: $b"
          test "$a" = "$b"

      # The Claude package was hand-assembled every release until 2.7.2, so
      # its membership was whoever built it — undiffable, unreproducible, and
      # unable to fail. Same two legs as the OpenAI archive above: build with
      # validation, then prove determinism.
      - name: Build and validate Claude plugin package
        run: python scripts/package_claude.py

      - name: Claude package build is deterministic (release provenance)
        run: |
          python3 scripts/package_claude.py --output-dir /tmp/tp-claude-a
          python3 scripts/package_claude.py --output-dir /tmp/tp-claude-b
          a=$(sha256sum /tmp/tp-claude-a/*.zip | cut -d' ' -f1)
          b=$(sha256sum /tmp/tp-claude-b/*.zip | cut -d' ' -f1)
          echo "build A: $a"; echo "build B: $b"
          test "$a" = "$b"

      # D-0010. Determinism proves an archive is reproducible FROM SOME TREE.
      # It never said WHICH tree, so nothing tied a shipped artifact to a
      # commit, let alone a green one. Each archive now carries a
      # provenance record naming its source commit; this leg is the other
      # half — it binds that commit to the tree THIS run verified, so an
      # artifact built in the release path cannot have come from anywhere
      # else. `verified_source` false means the build saw uncommitted edits,
      # which must never happen on a CI checkout.
      - name: Packages name the commit this run verified
        run: |
          python3 - <<'PY'
          import glob, json, subprocess, sys
          head = subprocess.run(["git", "rev-parse", "HEAD"],
                                capture_output=True, text=True).stdout.strip()
          found = sorted(glob.glob("/tmp/tp-pkg-a/*.provenance.json")
                         + glob.glob("/tmp/tp-claude-a/*.provenance.json"))
          if len(found) < 2:
              sys.exit(f"expected a provenance record per archive, got {found}")
          for path in found:
              rec = json.load(open(path))
              print(f"{rec['archive']}: commit {rec['commit']} "
                    f"verified_source={rec['verified_source']}")
              if rec["commit"] != head:
                  sys.exit(f"{path}: built from {rec['commit']}, this run "
                           f"verified {head} — the artifact is not the tree "
                           "that was tested")
              if not rec["verified_source"] or rec["dirty"]:
                  sys.exit(f"{path}: dirty CI checkout {rec['dirty']}")
          print("ok: every archive names the commit this run verified")
          PY

  # Install-truth scan that needs no test runner: org/Team members cannot
  # install plugins from GitHub themselves, so public copy must not claim
  # otherwise. Behavioral onboarding and static link checks remain in the
  # authoritative Python 3.12 pytest suite.
  docs-truth:
    name: docs truth (install paths + links)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: No public copy claims org members can install from GitHub (repo-wide)
        run: |
          python3 - <<'PY'
          import glob, re, sys
          # Keep these regexes in sync with FORBIDDEN_MEMBER_CLAIMS in
          # taskplane/tests/test_onboarding_docs.py (which self-tests them).
          PATTERNS = [
              r"(?i)\bmembers?\s+can\s+(?:also\s+|simply\s+|just\s+)?"
              r"(?:install|add|sync)\b[^.\n]{0,80}"
              r"(?:git\s?hub|marketplace|repository)",
              r"(?i)\bmembers?\s+(?:may|are\s+able\s+to)\s+"
              r"(?:install|add|sync)\b[^.\n]{0,80}"
              r"(?:git\s?hub|marketplace|repository)",
              r"(?i)\bany\s+member\b[^.\n]{0,40}\binstall\b",
          ]
          files = (["README.md", "CHANGELOG.md"]
                   + glob.glob(".claude-plugin/*.json")
                   + glob.glob(".codex-plugin/*.json")
                   + glob.glob("docs/**/*.md", recursive=True)
                   + glob.glob("skills/**/*.md", recursive=True)
                   + glob.glob("agents/**/*.md", recursive=True))
          bad = []
          for f in files:
              text = open(f, encoding="utf-8").read()
              for p in PATTERNS:
                  bad += [(f, h) for h in re.findall(p, text)]
          if bad:
              sys.exit("member-installs-from-GitHub claim in public copy: "
                       f"{bad}")
          print(f"clean: {len(files)} public-copy files scanned")
          PY
  # t6 (R-0002): the Codex-parity guard, REQUIRED and independent of the
  # workflow-path tests. Frozen brief fixtures replay through the dispatch
  # path and byte-compare against checked-in goldens, so a deliberate (or
  # accidental) change to the Task-dispatch payload shape fails THIS leg
  # even when the workflow path still works. A second named step runs t1's
  # detector-fixture completeness discipline (every catalog lens must keep
  # positive+negative fixtures) as an explicit CI signal rather than a line
  # lost inside the full-suite run. Kept out of validate-plugin on purpose:
  # that job is stdlib-only by design and this one needs pytest.
  codex-parity:
    name: codex dispatch parity + detector fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test runner (pinned major; the plugin itself is stdlib-only)
        run: pip install "pytest==8.*"
      - name: Configure git (the parity tests build throwaway fixture repos)
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"
      # Run from the repo ROOT (same rule as the tests job): conftest.py
      # resolves the taskplane package only when the root is on sys.path.
      - name: Codex dispatch parity (frozen briefs vs goldens)
        run: python3 -m pytest taskplane/tests/test_dispatch_parity.py -q
      - name: Detector-fixture completeness (positive+negative per lens)
        run: python3 -m pytest taskplane/tests/test_lens_signals_fixtures.py -q
      # t4 (R-0004): the STAGE-wave half of the parity guard. The three
      # governed stage dispatches (execute/evaluate/fix) replay through the
      # real CLI and byte-compare against checked-in goldens (regenerated
      # only via taskplane/tests/fixtures/briefs/regen.py — the documented
      # single regen path); the same file carries the kill-switch matrix,
      # the Codex stage cases (task bytes + no workflow path chosen,
      # trace-verified), the killed-mid-stage resume fixture, and the
      # every-gate-reachable-without-workflows adversarial walk.
      - name: Stage-wave parity + kill-switch matrix + Codex stage cases
        run: python3 -m pytest taskplane/tests/test_stage_waves.py -q

  # Required native-host leg. Unlike codex-parity's frozen payload replay,
  # this runs the hook lifecycle, strict spawn screening, hashed native task
  # identities, reasoning-effort routing, and execute-wave registration with
  # real Codex host markers present.
  codex-host:
    name: Codex native hooks + subagent workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test runner (pinned major; the plugin itself is stdlib-only)
        run: pip install "pytest==8.*"
      - name: Configure git (native-wave tests build throwaway repos)
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"
      - name: Codex lifecycle and strict native dispatch
        env:
          # The runner context is available at step evaluation time, not while
          # GitHub is validating job-level env expressions.
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_THREAD_ID: ci-codex-host
          TASKPLANE_HOME: ${{ runner.temp }}/taskplane-store
          TASKPLANE_WORKFLOWS: "0"
        run: >-
          python3 -m pytest -q
          taskplane/tests/test_codex_compat.py
          taskplane/tests/test_v101_fixes.py

  # Release-history truth. Five releases (v2.5.0, v2.5.1, v2.6.0, v2.8.1,
  # v2.8.2) shipped with NO tag and nobody noticed for months, because
  # tagging lived in a human's memory of the release routine — and two
  # CHANGELOG rows (v2.4.0, v2.3.0) name versions no tree ever declared.
  # This job makes the manifest history the source of truth and verifies
  # both claims against it. It needs the FULL history and the tags: a
  # shallow or tagless checkout cannot see what it is checking, so the gate
  # fails closed rather than passing on a misconfigured runner.
  release-tags:
    name: release history (every shipped version is tagged)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install test runner (pinned major; the plugin itself is stdlib-only)
        run: pip install "pytest==8.*"
      - name: Configure git (the gate's fixtures build throwaway repos)
        run: |
          git config --global user.email "ci@taskplane"
          git config --global user.name "taskplane-ci"
      # actions/checkout leaves a detached HEAD with no refs/heads/main on
      # push builds; the gate resolves the mainline by name, so give it one.
      - name: Make the mainline resolvable by name
        run: git rev-parse --verify refs/remotes/origin/main || git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Every shipped version is tagged, every tag names a release
        run: python3 scripts/ci_release_tags.py
      - name: The gate itself catches planted drift (it is not a no-op)
        run: python3 -m pytest taskplane/tests/test_release_tags.py -q
