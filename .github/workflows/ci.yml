name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  EVENT_NAME: ${{ github.event_name }}
  EXACT_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  RUN_ID: ${{ github.run_id }}

# Independent protected checks: no plan, join, pushed-SHA, or PR-head pseudo-job.
jobs:
  tests:
    name: tests (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          # Compatibility tests execute the exact pinned released generation.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - name: Install sealed test environment
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/requirements-test.lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/requirements-test.lock"
      - name: Initialize canonical settings and execute one unsharded suite
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell pytest-1 --receipt "$RUNNER_TEMP/taskplane-ci/pytest-1.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: authoritative-tests-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}

  quality-package:
    name: quality + package + release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - name: Install sealed quality environment
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-dev.lock
      - name: Initialize canonical settings and execute quality, package, and provenance
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell quality-package --receipt "$RUNNER_TEMP/taskplane-ci/quality-package.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-package-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}

  dashboard-browser:
    name: dashboard browser conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - name: Install sealed browser-test environment
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/requirements-test.lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/requirements-test.lock"
      - name: Initialize settings, freeze browser identity, and execute browser behavior
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --observe-browser --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell dashboard-browser --receipt "$RUNNER_TEMP/taskplane-ci/dashboard-browser.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dashboard-browser-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}

  interpreter-import:
    name: interpreter import (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "${{ matrix.python }}"}
      - name: Initialize canonical settings and compile/import shipped entry points
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell interpreter-import-${{ matrix.python }} --receipt "$RUNNER_TEMP/taskplane-ci/interpreter-import.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interpreter-import-${{ matrix.python }}-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}

  native-portability:
    name: native portability (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12", cache: pip}
      - name: Install sealed native-test environment
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/requirements-test.lock"
          python -m pip install --disable-pip-version-check --require-hashes --no-deps -r "$RUNNER_TEMP/requirements-test.lock"
      - name: Initialize canonical settings and execute native-only portability behavior
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell os-portability-windows --receipt "$RUNNER_TEMP/taskplane-ci/os-portability-windows.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-portability-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}

  security-no-egress:
    name: zero-token corpus (credential-empty, no-egress)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: {python-version: "3.12"}
      - name: Initialize canonical settings and execute one credential-empty no-egress run
        id: execute
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/taskplane-ci" "$RUNNER_TEMP/taskplane-empty-home"
          python scripts/ci_local.py --emit-ci-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --github-output "$GITHUB_OUTPUT" --source-sha "$CANDIDATE_SHA" --event "$EVENT_NAME" --ref "$EXACT_REF" --run-id "$RUN_ID"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/taskplane-empty-home" LANG=C.UTF-8 LC_ALL=C.UTF-8 RUNNER_TEMP="$RUNNER_TEMP" python scripts/ci_local.py --runtime-plan "$RUNNER_TEMP/taskplane-ci/runtime.json" --ci-cell security-no-egress --receipt "$RUNNER_TEMP/taskplane-ci/security-no-egress.json"
      - name: Publish candidate, settings, command, runtime, failure, quality, artifact, and cleanup receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-no-egress-${{ env.CANDIDATE_SHA }}
          path: ${{ runner.temp }}/taskplane-ci
          if-no-files-found: error
          retention-days: ${{ fromJSON(steps.execute.outputs.retention-days) }}
