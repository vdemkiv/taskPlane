name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PYTHONUTF8: "1"
jobs:
  tests:
    name: tests (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - name: Install test dependencies
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests
  quality-package:
    name: quality + package + release provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --require-hashes --no-deps -r requirements-dev.lock
      - run: python scripts/ci_local.py --check quality
      - run: python scripts/ci_local.py --check package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugins-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  dashboard-browser:
    name: dashboard browser conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check browser
  interpreter-import:
    name: interpreter import (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m compileall -q taskplane scripts
      - run: python taskplane/tp.py --help
      - run: python taskplane/tp.py flow --help
  native-portability:
    name: native portability (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: "3.12"}
      - name: Install test dependencies
        shell: bash
        run: |
          awk 'sub(/^# test-lock: /, "")' requirements-dev.lock > "$RUNNER_TEMP/tests.lock"
          python -m pip install --require-hashes --no-deps -r "$RUNNER_TEMP/tests.lock"
      - run: python scripts/ci_local.py --check tests
