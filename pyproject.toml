[tool.pytest.ini_options]
markers = [
  "taskplane_capacity: full repeated-repair storage-capacity workload",
  "taskplane_packages: isolated shipped archive workflow behavior",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["taskplane/tests"]
# ``lens_signals`` intentionally re-exports the lower routing engine at runtime;
# list only those dynamically installed names.  ``review.evidence`` is retained
# as a compatibility alias until its owning remediation task can change source.
# Unlike a per-file F821 suppression, every other undefined name in either file
# (and every future production file) remains an error.
builtins = [
  "Ctx",
  "DEEP_CAP",
  "DEEP_TARGET",
  "_graph_payload",
  "apply_budget",
  "evidence",
  "load_catalog",
  "verdicts",
]

[tool.ruff.lint]
# Start with correctness rules over every shipped production entry point.  The
# broader style backlog must not weaken this zero-warning floor.
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
# Type-check the documented runtime floor while executing the gate on the
# separately approved Python 3.14 validation interpreter.
python_version = "3.10"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
pretty = false
incremental = false
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
ignore_missing_imports = true

# Check the complete shipped top-level package on every run.  Taskplane retains
# a flat-module runtime compatibility mode, so sibling imports intentionally do
# not form a conventional typed package; every production file is nevertheless
# a direct mypy target and imports are no longer skipped.
files = ["taskplane/*.py"]

# Existing graph scanners are checked for runtime correctness by Ruff and tests.
# Native usage readers and the shared flow keep strict type checking.
[[tool.mypy.overrides]]
module = [
  "taskplane.depgraph", "taskplane.graph_decomposition", "taskplane.graph_primitives",
  "taskplane.decompose", "taskplane.glob_match", "taskplane.path_roles", "taskplane.spend"
]
ignore_errors = true
